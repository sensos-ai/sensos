name: Prepare release
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Optional patch, minor, or major; empty uses an AI suggestion
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Resolve release and stage Changeset
        id: autoship
        uses: ./.github/actions/autoship
        with:
          release_type: ${{ inputs.release_type }}
          evaluation-model: ${{ vars.EVAL_MODEL || 'typesafe-ai/jev' }}
          changelog-model: ${{ vars.CHANGELOG_MODEL }}
          ai-gateway-api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Require version mode
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: test "$MODE" = version
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Version packages and open release PR
        id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: bun run .github/actions/autoship/prepare-release.ts apply
          commit-message: "chore(release): prepare stable release"
          pr-title: "chore(release): prepare stable release"
          pr-base-branch: main
      - name: Summarize preparation
        env:
          RELEASE_TYPE: ${{ steps.autoship.outputs.release_type }}
          RELEASE_VERSION: ${{ steps.autoship.outputs.version }}
          PR_NUMBER: ${{ steps.version.outputs.pr-number }}
        run: |
          {
            echo "## Release preparation"
            echo
            echo "- Version: \`v$RELEASE_VERSION\`"
            echo "- Release type: \`$RELEASE_TYPE\`"
            echo "- Pull request: #$PR_NUMBER"
          } >> "$GITHUB_STEP_SUMMARY"
