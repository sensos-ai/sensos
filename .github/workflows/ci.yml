name: CI

on:
  workflow_dispatch:
  merge_group:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-permissions:
    name: Check Permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Skip permission check for trusted events
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: echo "Permission check not required."
      - name: Get triggering actor permission
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        id: check_access
        uses: actions-cool/check-user-permission@7b90a27f92f3961b368376107661682c441f6103 # v2.3.0
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject unauthorized fork workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && steps.check_access.outputs.require-result == 'false'
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          USER_PERMISSION: ${{ steps.check_access.outputs.user-permission }}
          ORIGINAL_ACTOR: ${{ github.actor }}
        run: |
          echo "$TRIGGERING_ACTOR does not have permissions on this repository."
          echo "Current permission level is $USER_PERMISSION."
          echo "The workflow was originally triggered by $ORIGINAL_ACTOR."
          exit 1

  changes:
    name: Detect package changes
    needs: check-permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect package infrastructure changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            base="$BEFORE_SHA"
          elif [[ -n "$BASE_SHA" ]]; then
            base="$BASE_SHA"
          else
            base="HEAD^"
          fi
          changed_files="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$changed_files" | grep -Eq '^((packages/|scripts/(ci|release)/|scripts/test-remote-e2e\.ts$)|package\.json$|bun\.lock$|bunup\.config\.ts$|turbo\.json$|biome\.json(c)?$|tsconfig\.json$|\.github/workflows/(ci|prepare-release|tag-release|canary|release)\.yml$)'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  static-analysis:
    name: Static Analysis
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_CACHE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run lint typecheck --filter='./packages/*'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_CACHE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run test --filter='./packages/*'

  build-packages:
    name: Build Packages
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_CACHE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@sensos-ai/shared --filter=@sensos-ai/client
      - run: bun run scripts/ci/validate-package-tarballs.ts

  build-cli:
    name: Build CLI
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_CACHE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@sensos-ai/cli
      - run: bun run scripts/ci/validate-cli-binaries.ts

  pkg-pr-new:
    name: Publish with pkg-pr-new
    needs: [changes, static-analysis, unit-tests, build-packages, build-cli]
    if: >-
      needs.changes.outputs.packages == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Turborepo Remote Cache
        if: vars.TURBO_TEAM != ''
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@sensos-ai/shared --filter=@sensos-ai/client
      - name: Publish shared and client previews
        id: publish
        run: >-
          bunx pkg-pr-new publish
          --previewVersion --packageManager=bun --comment=update --bun
          ./packages/shared ./packages/client
      - name: Add preview URLs to job summary
        env:
          PREVIEW_URLS: ${{ steps.publish.outputs.urls }}
        run: |
          {
            echo "## pkg.pr.new previews"
            echo
            for url in $PREVIEW_URLS; do echo "- $url"; done
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    if: always()
    needs:
      [
        check-permissions,
        changes,
        static-analysis,
        unit-tests,
        build-packages,
        build-cli,
        pkg-pr-new,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful package validation
        env:
          PERMISSIONS_RESULT: ${{ needs.check-permissions.result }}
          PACKAGE_CHANGES: ${{ needs.changes.outputs.packages }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          BUILD_PACKAGES_RESULT: ${{ needs.build-packages.result }}
          BUILD_CLI_RESULT: ${{ needs.build-cli.result }}
          PKG_PR_NEW_RESULT: ${{ needs.pkg-pr-new.result }}
        run: |
          if [[ "$PERMISSIONS_RESULT" != "success" ]]; then
            echo "The triggering actor is not authorized to run CI for this fork."
            exit 1
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Package change detection failed."
            exit 1
          fi
          if [[ "$PACKAGE_CHANGES" != "true" ]]; then
            echo "No package infrastructure changes; package jobs were intentionally skipped."
            exit 0
          fi
          for result in "$STATIC_ANALYSIS_RESULT" "$UNIT_TESTS_RESULT" "$BUILD_PACKAGES_RESULT" "$BUILD_CLI_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required package validation job did not succeed."
              exit 1
            fi
          done
          if [[ "$PKG_PR_NEW_RESULT" != "success" && "$PKG_PR_NEW_RESULT" != "skipped" ]]; then
            echo "Package preview publication failed."
            exit 1
          fi
          echo "All required package validation succeeded."
