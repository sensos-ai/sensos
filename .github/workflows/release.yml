name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Optional patch, minor, or major; empty uses an AI suggestion
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sensos-publication
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Validate release configuration
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SENSOS_REGISTRY_ENDPOINT: ${{ vars.SENSOS_REGISTRY_ENDPOINT }}
          SENSOS_STREAMS_URL: ${{ vars.SENSOS_STREAMS_URL }}
        run: |
          for name in AI_GATEWAY_API_KEY R2_ENDPOINT R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SENSOS_REGISTRY_ENDPOINT SENSOS_STREAMS_URL; do
            if [[ -z "${!name}" ]]; then
              echo "Missing $name" >&2
              exit 1
            fi
          done
          if [[ -z "$RELEASE_TOKEN" && ( -z "$RELEASE_APP_ID" || -z "$RELEASE_APP_PRIVATE_KEY" ) ]]; then
            echo 'Configure RELEASE_TOKEN or RELEASE_APP_ID + RELEASE_APP_PRIVATE_KEY with permission to commit release versions to main.' >&2
            exit 1
          fi
      - name: Create release App token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_TOKEN }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Check for prepared release
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/release/prepare-context.ts
      - name: Restore prepared release
        if: steps.context.outputs.resume == 'true'
        env:
          PREPARED_SHA: ${{ steps.context.outputs.source_sha }}
        run: git checkout --detach "$PREPARED_SHA"
      - name: Prepare version and changelog
        if: steps.context.outputs.resume != 'true'
        uses: ./.github/actions/autoship
        with:
          release_type: ${{ inputs.release_type }}
          evaluation-model: ${{ vars.EVAL_MODEL || 'typesafe-ai/jev' }}
          changelog-model: ${{ vars.CHANGELOG_MODEL || 'openai/gpt-5.6-luna' }}
          ai-gateway-api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
      - name: Apply release version
        if: steps.context.outputs.resume != 'true'
        run: bun run .github/actions/autoship/prepare-release.ts apply
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check release
        run: |
          bun run turbo:lint
          bun run turbo:typecheck
          bun run turbo:test
      - name: Commit release
        if: steps.context.outputs.resume != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock CHANGELOG.md .changeset .release/preparation.json packages/cli/package.json packages/cli/CHANGELOG.md packages/shared/package.json packages/shared/CHANGELOG.md packages/client/package.json packages/client/CHANGELOG.md
          version=$(bun -e 'console.log((await Bun.file(".release/preparation.json").json()).version)')
          git commit -m "chore(release): prepare v$version"
          git push origin HEAD:main
      - name: Export version and commit
        id: release
        run: |
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(bun -e 'console.log((await Bun.file(".release/preparation.json").json()).version)')" >> "$GITHUB_OUTPUT"
      - name: Configure build matrix
        id: targets
        run: echo "matrix=$(bun run scripts/release/targets.ts)" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build ${{ matrix.asset }}
    needs: prepare
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/build-binaries.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      target: ${{ matrix.name }}
      asset: ${{ matrix.asset }}
      runner: ${{ matrix.runner }}
      registry_endpoint: ${{ vars.SENSOS_REGISTRY_ENDPOINT }}
      streams_url: ${{ vars.SENSOS_STREAMS_URL }}

  publish:
    name: Publish CLI and SDKs
    needs: [prepare, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      CHANNEL: stable
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ github.token }}
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Set release paths
        run: |
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/release.npmrc" >> "$GITHUB_ENV"
          echo "ASSET_DIR=$RUNNER_TEMP/release-assets" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Authenticate GitHub Packages
        run: |
          echo '@sensos-ai:registry=https://npm.pkg.github.com' > "$NPM_CONFIG_USERCONFIG"
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
      - name: Check unpublished packages
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Require versioned packages
        if: steps.mode.outputs.mode == 'version'
        run: |
          echo 'Changesets requires versioning; preparation did not produce a publishable version.' >&2
          exit 1
      - name: Build SDK packages
        run: bun run turbo:build --force --filter=@sensos-ai/shared --filter=@sensos-ai/client
      - name: Publish SDK packages
        if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ github.token }}
          script: bun run publish:packages
          create-github-releases: 'false'
          # Our publisher tags SOURCE_SHA; this action tags the workflow's original SHA.
          push-git-tags: 'false'
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: Generate checksums
        run: bun run scripts/release/checksums.ts
      - name: Create publication App token
        id: release-app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Publish GitHub releases and CDN assets
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token || secrets.RELEASE_TOKEN }}
        run: bun run scripts/release/publish-assets.ts
